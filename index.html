<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  }

  #stage {
    position: fixed; inset: 0;
    perspective: 1000px;
  }
  #heart {
    position: absolute; inset: 0;
    transition: opacity 1.5s ease;
  }
  #heart.gone { opacity: 0; }

  /* หัวใจเต็มแล้ว → มีคำ I love you ลอยขึ้นจากทุกคำเรื่อย ๆ แต่หัวใจอยู่กับที่
     (ใช้ 2 ชั้น ::before / ::after สลับกันให้ลอยถี่ ๆ) */
  .word::before, .word::after {
    content: attr(data-t);
    position: absolute; left: 0; top: 0;
    opacity: 0;
    color: #ffa3cc;
    text-shadow: 0 0 6px #ffc2dc, 0 0 14px #ff4d9a, 0 0 26px #ff2d85;
  }
  #heart.rise .word::before,
  #heart.rise .word::after {
    animation: rise 4s cubic-bezier(.25, .6, .4, 1) infinite backwards;
    animation-delay: var(--rd);
  }
  #heart.rise .word::after { animation-delay: calc(var(--rd) + 2s); }
  @keyframes rise {
    0%   { transform: translateY(0)      scale(1);    opacity: 0; }
    20%  { opacity: .95; }
    60%  { opacity: .55; }
    100% { transform: translateY(-4.5em) scale(1.08); opacity: 0; }
  }

  /* ประกายเล็ก ๆ ลอยขึ้นช้า ๆ ด้านหลัง */
  #sparkle { position: fixed; inset: 0; pointer-events: none; }

  .word {
    position: absolute;
    white-space: nowrap;
    font-weight: 600;
    color: #ff8cc0;
    text-shadow: 0 0 4px #ffc2dc, 0 0 10px #ff4d9a, 0 0 20px #ff2d85;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity .8s ease;
    pointer-events: none;
  }
  .word.show { opacity: 1; }
  .word .t { transition: opacity .35s linear; }

  /* ข้อความตอนจบ */
  #final {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    text-align: center;
    color: #ff6fae;
    font-size: clamp(32px, 9vw, 96px);
    font-weight: 700;
    text-shadow: 0 0 10px #ff6fae, 0 0 30px #ff3d8f, 0 0 60px #ff3d8f;
    pointer-events: none;
  }
  #final { transition: opacity 1.5s ease; }
  #final.gone { opacity: 0; }
  #final span { opacity: 0; transition: opacity .5s ease; white-space: pre; }
  #final span.show { opacity: 1; }

  /* หน้ากดเพื่อเริ่ม */
  #gate {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
    color: #ff6fae;
    font-size: 20px;
    text-shadow: 0 0 10px #ff3d8f;
    cursor: pointer;
    user-select: none;
    transition: opacity .8s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #gate.gone { opacity: 0; pointer-events: none; }
  #gate .big {
    font-size: 80px;
    text-shadow: 0 0 20px #ff3d8f, 0 0 40px #ff3d8f;
    animation: thump 1.2s ease-in-out infinite;
  }
  @keyframes thump {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.18); }
    30% { transform: scale(1); }
    45% { transform: scale(1.12); }
  }
</style>
</head>
<body>

<canvas id="sparkle"></canvas>
<div id="stage"><div id="heart"></div></div>
<div id="final"></div>
<div id="gate"><div class="big">❤</div><div>กดไอ้สัตว์</div></div>

<audio id="audio" loop preload="auto">
  <source src="song.mp3">
  <source src="song.mp4">
  <source src="song.m4a">
</audio>

<script>
  // ===== ตั้งค่า =====
  const TEXT        = 'I love you';
  const FINAL_TEXT  = 'I love แม่มึงอ่ะ';
  const WORDS       = 60;    // จำนวนคำรอบหัวใจ
  const STEP_MS     = 120;   // ความเร็วที่คำขึ้นทีละคำ / ความเร็วแสงวิ่งรอบหัวใจ
  const TRAIL       = 0.85;  // ความยาวหางแสง (0–1 ของรอบหัวใจ)
  const MIN_LIGHT   = 0.12;  // ความสว่างต่ำสุดของคำที่จางที่สุด
  const HOLD_MS     = 10000; // เวลาที่หัวใจค้างไว้ก่อนหายไป
  const LETTER_MS   = 180;   // ความเร็วพิมพ์ข้อความตอนจบ
  const END_MS      = 4000;  // โชว์ข้อความตอนจบกี่มิลลิวินาที ก่อนวนกลับไปเริ่มหัวใจใหม่

  const heart = document.getElementById('heart');
  const finalEl = document.getElementById('final');
  let timers = [], spin = null;
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  // สมการหัวใจ
  function heartPoint(t) {
    return {
      x: 16 * Math.pow(Math.sin(t), 3),
      y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
    };
  }

  function start() {
    timers.forEach(clearTimeout);
    timers = [];
    clearInterval(spin);
    heart.innerHTML = '';
    heart.classList.remove('gone', 'rise');
    finalEl.innerHTML = '';
    finalEl.classList.remove('gone');

    const W = innerWidth, H = innerHeight - 60;
    const scale = Math.min(W / 40, H / 36);
    const cx = W / 2, cy = H / 2 + scale * 1.5;
    const size = Math.max(9, scale * 0.95);

    // เริ่มที่ปลายแหลมด้านล่าง → ขึ้นด้านซ้าย → รอยหยักตรงกลาง → ด้านขวา → กลับลงปลายแหลม
    const words = [];
    for (let i = 0; i < WORDS; i++) {
      const p = heartPoint(Math.PI + (i / WORDS) * Math.PI * 2);
      const el = document.createElement('span');
      el.className = 'word';
      el.innerHTML = '<span class="t"></span>';
      el.firstChild.textContent = TEXT;
      el.dataset.t = TEXT;
      // เริ่มลอยทีละคำแบบค่อย ๆ ไล่กันไป ไม่โผล่พร้อมกันทีเดียว
      el.style.setProperty('--rd', (i / WORDS * 2 + Math.random() * 1.5).toFixed(2) + 's');
      el.style.left = cx + p.x * scale + 'px';
      el.style.top = cy + p.y * scale + 'px';
      el.style.fontSize = size + 'px';
      heart.appendChild(el);
      words.push(el);
    }

    // ความสว่างไล่เป็นวงรอบหัวใจ: คำที่ "หัวแสง" สว่างสุด ยิ่งห่างไปข้างหลังยิ่งจาง
    function light(head, shown) {
      words.forEach((el, i) => {
        if (i >= shown) return;
        const behind = ((head - i) % WORDS + WORDS) % WORDS / WORDS;
        el.classList.add('show');
        el.firstChild.style.opacity = Math.max(MIN_LIGHT, 1 - behind / TRAIL).toFixed(2);
      });
    }

    // 1) ขึ้นทีละคำ วนรอบหัวใจ
    let t = 300;
    words.forEach((el, i) => later(() => light(i, i + 1), t += STEP_MS));

    // 2) วาดครบแล้ว แสงวิ่งวนรอบหัวใจต่อไปเรื่อย ๆ
    later(() => {
      let head = WORDS - 1;
      spin = setInterval(() => light(++head, WORDS), STEP_MS);
      heart.classList.add('rise');
    }, t);

    // 3) ค้างไว้ ~10 วิ แล้วหายไป
    t += HOLD_MS;
    later(() => heart.classList.add('gone'), t);
    later(() => clearInterval(spin), t + 1600);

    // 4) พิมพ์ข้อความตอนจบทีละตัว
    t += 1800;
    const letters = window.Intl && Intl.Segmenter
      ? [...new Intl.Segmenter('th', { granularity: 'grapheme' }).segment(FINAL_TEXT)].map(s => s.segment)
      : Array.from(FINAL_TEXT);
    const spans = letters.map(ch => {
      const s = document.createElement('span');
      s.textContent = ch;
      finalEl.appendChild(s);
      return s;
    });
    spans.forEach(s => later(() => s.classList.add('show'), t += LETTER_MS));

    // 5) ข้อความจางหาย แล้ววนกลับไปเริ่มใหม่ไม่มีวันหยุด
    t += END_MS;
    later(() => finalEl.classList.add('gone'), t);
    later(start, t + 1700);
  }

  let resizeTimer;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    if (started) resizeTimer = setTimeout(start, 250);
  });

  // ===== เพลง: เล่นเองอัตโนมัติจากไฟล์ song.mp3 / song.mp4 / song.m4a ในโฟลเดอร์เดียวกัน =====
  // ===== ประกายชมพูลอยขึ้นช้า ๆ =====
  (function sparkles() {
    const cv = document.getElementById('sparkle');
    const ctx = cv.getContext('2d');
    let dots = [];
    function size() {
      const dpr = devicePixelRatio || 1;
      cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(innerWidth * innerHeight / 14000);
      dots = Array.from({ length: n }, () => ({
        x: Math.random() * innerWidth, y: Math.random() * innerHeight,
        r: Math.random() * 1.4 + 0.3, v: Math.random() * 0.25 + 0.05,
        p: Math.random() * Math.PI * 2
      }));
    }
    size();
    addEventListener('resize', size);
    (function frame() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const d of dots) {
        d.y -= d.v; d.p += 0.02;
        if (d.y < -5) { d.y = innerHeight + 5; d.x = Math.random() * innerWidth; }
        ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(d.p));
        ctx.fillStyle = '#ff8cc0';
        ctx.shadowColor = '#ff3d8f'; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
      }
      requestAnimationFrame(frame);
    })();
  })();

  const audio = document.getElementById('audio');
  const gate = document.getElementById('gate');
  audio.volume = 0.8;

  let started = false;
  function begin() {
    if (started) return;
    started = true;
    start();
  }
  // เพลงดังแล้ว → หัวใจตามมา (เพลงมาก่อนเสมอ)
  audio.addEventListener('playing', () => setTimeout(begin, 400));

  // กดหัวใจ → เพลงเริ่ม → หัวใจ I love you ตามมา
  gate.addEventListener('click', () => {
    gate.classList.add('gone');
    audio.play().catch(begin);   // ไม่มีไฟล์เพลง → เริ่มหัวใจเลย
    setTimeout(begin, 2500);     // กันเหนียว ถ้าเพลงโหลดช้า
  }, { once: true });
</script>
</body>
</html>
