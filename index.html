<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รู้ทุกอย่างแต่ไม่พูด - รู้มือค้าบบบ</title>

  <!-- นำเข้าฟอนต์ Kanit จาก Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      /* พื้นหลังโทนมืดไล่เฉดสีลึก */
      background: radial-gradient(circle at center, #1e1b4b 0%, #090514 100%);
      color: #fff;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: 'Kanit', sans-serif;
      overflow: hidden;
    }

    /* กล่องข้อความสไตล์ Glassmorphism */
    .container {
      text-align: center;
      padding: 50px 70px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      animation: fadeIn 1.2s ease-out;
    }

    /* หัวข้อหลัก */
    h1 {
      font-size: 48px;
      font-weight: 600;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ffffff 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(192, 132, 252, 0.4);
      margin-bottom: 12px;
      transition: transform 0.3s ease;
    }

    /* หัวข้อย่อย / ข้อความด้านล่าง */
    p.subtitle {
      font-size: 24px;
      font-weight: 300;
      color: #a7f3d0;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(167, 243, 208, 0.4);
      opacity: 0.9;
    }

    /* เอฟเฟกต์เมื่อวางเมาส์เหนือกล่อง */
    .container:hover h1 {
      transform: scale(1.03);
    }

    /* แอนิเมชันเปิดตัว */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* รองรับหน้าจอมือถือ */
    @media (max-width: 600px) {
      .container {
        padding: 30px 25px;
        margin: 0 20px;
      }
      h1 {
        font-size: 32px;
      }
      p.subtitle {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>รู้ทุกอย่างแต่ไม่พูด</h1>
    <p class="subtitle">รู้มือค้าบบบ</p>
  </div>

</body>
</html>
