<!DOCTYPE html>
<html lang="th" class="locked">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04010a">
<meta name="robots" content="noindex,nofollow">
<title>♡</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#04010a;
  --pink:#ff86c8;
  --pink-soft:#ffd0ea;
  --text:#fff3fa;
  --f:'Mali',system-ui,sans-serif;
  --fe:'Cormorant Garamond',Georgia,serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
html{background:var(--bg);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f);-webkit-font-smoothing:antialiased;min-height:100%}
::selection{background:rgba(255,134,200,.35)}

/* ───────────── 1 · LOCK: nothing but the code ───────────── */
#lock{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:radial-gradient(120% 90% at 50% 50%,#0b0414 0%,#04010a 62%,#020005 100%);
  transition:opacity 1.2s ease .35s,visibility 1.2s .35s;cursor:text;touch-action:manipulation}
#lock.gone{opacity:0;visibility:hidden}
#pins{display:flex;gap:17px}
#pins i{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1.2px rgba(255,220,240,.3);
  transition:background .25s,box-shadow .25s,transform .35s var(--spring)}
#pins i.on{background:#ffd6ec;box-shadow:0 0 14px 3px rgba(255,130,200,.6);transform:scale(1.12)}
#steps{display:flex;gap:9px}
#steps b{width:4px;height:4px;border-radius:50%;background:rgba(255,220,240,.16);transition:background .4s,box-shadow .4s}
#steps b.on{background:rgba(255,195,228,.75);box-shadow:0 0 8px rgba(255,140,205,.6)}
#lock.busy #pins i.on{animation:pulse .7s ease-in-out infinite alternate}
#lock.busy #pins i:nth-child(2){animation-delay:.08s}#lock.busy #pins i:nth-child(3){animation-delay:.16s}
#lock.busy #pins i:nth-child(4){animation-delay:.24s}#lock.busy #pins i:nth-child(5){animation-delay:.32s}
#lock.busy #pins i:nth-child(6){animation-delay:.4s}
@keyframes pulse{to{transform:scale(.8);opacity:.55}}
#lock.bad #pins{animation:shk .55s cubic-bezier(.36,.07,.19,.97)}
#lock.bad #pins i{box-shadow:inset 0 0 0 1.2px rgba(255,140,160,.6)}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
#lock.ok #pins i{background:#fff;box-shadow:0 0 20px 6px rgba(255,170,220,.9);transform:scale(1.25)}
#lockmsg{min-height:1.2em;font-size:13px;color:rgba(255,190,205,.75);text-align:center;padding:0 24px}
#pin{position:fixed;left:50%;top:50%;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;caret-color:transparent}
#bloom{position:fixed;left:50%;top:50%;width:60vmax;height:60vmax;margin:-30vmax 0 0 -30vmax;border-radius:50%;z-index:60;pointer-events:none;opacity:0;
  background:radial-gradient(circle,#fff 0%,#ffe0f2 16%,rgba(255,150,215,.6) 38%,rgba(190,110,255,.25) 58%,rgba(0,0,0,0) 72%)}
#bloom.go{animation:bloom 2s cubic-bezier(.3,.6,.2,1) forwards}
@keyframes bloom{0%{opacity:1;transform:scale(.02)}45%{opacity:1}100%{opacity:0;transform:scale(2.6)}}

/* ───────────── 2 · THE SKY ───────────── */
#app{display:none}
body.open #app{display:block}
#sky{position:fixed;inset:0;z-index:0;overflow:hidden;opacity:0;transition:opacity 2.6s ease .5s;pointer-events:none;
  background:radial-gradient(130% 95% at 50% 40%,#1a0827 0%,#0c0316 52%,#04010a 100%)}
body.open #sky{opacity:1}
#sky canvas{position:absolute;left:0;top:-160px;width:100%;height:calc(100% + 320px);will-change:translate}
#sky2{will-change:translate}
#twk{position:absolute;left:0;top:-90px;width:100%;height:calc(100% + 180px);will-change:translate}
.aset{position:absolute;inset:0;opacity:0;transition:opacity 3s ease}
.aset.on{opacity:1}
.blob{position:absolute;width:105vmax;height:105vmax;border-radius:50%;will-change:transform;animation:driftA 60s ease-in-out infinite alternate;animation-play-state:paused}
.aset.on .blob{animation-play-state:running}
.blob.b1{left:-30%;top:-22%}
.blob.b2{right:-38%;bottom:-26%;animation-name:driftB;animation-duration:78s}
@keyframes driftA{to{transform:translate3d(14%,10%,0) scale(1.12)}}
@keyframes driftB{to{transform:translate3d(-12%,-9%,0) scale(1.15)}}
#motes{position:absolute;inset:0;overflow:hidden}
.mote{position:absolute;left:var(--x);top:0;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;
  background:radial-gradient(circle,var(--c) 0%,rgba(0,0,0,0) 68%);opacity:0;will-change:transform,opacity;animation:mote var(--d) linear var(--dl) infinite}
@keyframes mote{0%{transform:translate3d(0,108vh,0);opacity:0}14%{opacity:var(--o)}50%{opacity:calc(var(--o)*.45)}86%{opacity:var(--o)}100%{transform:translate3d(var(--dx),-8vh,0);opacity:0}}
.tw{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,205,238,.9);opacity:.15;animation:tw var(--d) ease-in-out var(--dl) infinite}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
.shoot{position:absolute;width:170px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,200,235,.55) 60%,#fff);opacity:0}
.shoot::after{content:'';position:absolute;right:-3px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,190,230,.8)}

/* chrome */
#bar{position:fixed;left:0;right:0;top:0;height:2px;z-index:40;opacity:0;transition:opacity 1.5s ease 2s}
#bar i{display:block;height:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#ff86c8,#b77cff);box-shadow:0 0 10px rgba(255,134,200,.8)}
body.open #bar{opacity:1}
#music{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:45;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(20,6,32,.55);box-shadow:inset 0 0 0 1px rgba(255,200,235,.3);color:var(--pink-soft);font-size:16px;opacity:0;visibility:hidden;transition:opacity .8s ease 2.2s,visibility .8s 2.2s}
body.open #music{opacity:1;visibility:visible}
#music.muted{opacity:.45!important}
#music.none{display:none}
#rail{position:fixed;right:clamp(14px,2.6vw,34px);top:50%;transform:translateY(-50%);height:min(46vh,420px);width:14px;z-index:40;display:none;opacity:0;transition:opacity 1.5s ease 2.4s}
body.open #rail{opacity:1}
#rail::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;margin-left:-.5px;background:linear-gradient(180deg,rgba(255,200,235,0),rgba(255,200,235,.3) 12%,rgba(255,200,235,.3) 88%,rgba(255,200,235,0))}
#rail button{position:absolute;left:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border:0;border-radius:50%;cursor:pointer;background:rgba(255,215,240,.35);transition:background .4s,box-shadow .4s,transform .4s var(--spring)}
#rail button.on{background:#ffd6ec;box-shadow:0 0 12px 3px rgba(255,130,200,.7);transform:scale(1.35)}
#rail button::after{content:attr(data-h);position:absolute;right:20px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:13px;color:var(--pink-soft);
  padding:5px 12px;border-radius:999px;background:rgba(20,6,32,.85);box-shadow:inset 0 0 0 1px rgba(255,200,235,.25);opacity:0;pointer-events:none;transition:opacity .3s}
@media (hover:hover){#rail button:hover::after{opacity:1}}
@media (min-width:820px){#rail{display:block}}

/* ───────────── 3 · THE READING ───────────── */
#doc{position:relative;z-index:1}
.col{width:min(680px,100%);margin:0 auto;padding:0 clamp(22px,6vw,34px)}

.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12vh 24px 14vh}
.eyebrow{font-family:var(--fe);font-style:italic;font-size:clamp(17px,3.6vw,22px);letter-spacing:.14em;color:var(--pink-soft);opacity:0;transition:opacity 1.6s ease .1s}
.title{font-weight:500;font-size:clamp(40px,12vw,92px);line-height:1.25;margin:16px 0 20px;filter:drop-shadow(0 0 22px rgba(255,120,200,.45))}
.title .ch{display:inline-block;white-space:pre;padding:.28em .04em .1em;margin:-.28em -.04em -.1em;opacity:0;transform:translateY(24px) scale(.94);filter:blur(12px);
  background:linear-gradient(180deg,#fff 0%,#ffd6ec 52%,#e0a6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  transition:opacity 1.2s var(--ease),transform 1.3s var(--ease),filter 1.2s var(--ease);transition-delay:calc(var(--i)*85ms + 500ms)}
.hero.in .ch{opacity:1;transform:none;filter:none}
.hero.in .eyebrow{opacity:.9}
.sub{max-width:24em;font-weight:300;font-size:clamp(16px,4vw,20px);line-height:1.9;color:rgba(255,232,246,.75);opacity:0;transform:translateY(12px);
  transition:opacity 1.6s ease 1.9s,transform 1.6s var(--ease) 1.9s}
.hero.in .sub{opacity:1;transform:none}
.hint{position:absolute;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;
  font-family:var(--fe);font-style:italic;font-size:15px;letter-spacing:.12em;color:rgba(255,225,245,.85);text-shadow:0 0 12px rgba(8,2,14,.9);opacity:0;transition:opacity 1.6s ease 3.2s}
.hero.in .hint{opacity:1}
.hint svg{width:18px;height:18px;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(7px);opacity:.5}}
.hero{position:relative}

.chap{padding:clamp(80px,17vh,150px) 0 0}
.chap:first-of-type{padding-top:clamp(40px,8vh,80px)}
.num{font-family:var(--fe);font-style:italic;font-weight:500;font-size:clamp(20px,4.4vw,26px);letter-spacing:.2em;color:var(--pink)}
.h{font-weight:500;font-size:clamp(28px,7.4vw,44px);line-height:1.4;margin:0;padding:.3em 0 .12em;
  background:linear-gradient(180deg,#fff 0%,#ffd6ec 55%,#e3a9ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,120,200,.28))}
.rule{display:flex;align-items:center;gap:10px;margin:18px 0 clamp(28px,6vh,46px);color:var(--pink);font-size:12px}
.rule i{display:block;height:1px;width:0;background:linear-gradient(90deg,rgba(255,150,210,.9),rgba(255,150,210,0));transition:width 1.6s var(--ease) .3s}
.in .rule i,.rule.in i{width:clamp(70px,22vw,130px)}

p.t{font-weight:400;font-size:clamp(17px,4.4vw,20px);line-height:2.1;letter-spacing:.01em;color:rgba(255,244,251,.93);
  margin:0 0 1.7em;text-shadow:0 1px 16px rgba(8,2,14,.95),0 0 3px rgba(8,2,14,.7);overflow-wrap:anywhere}
.rv{opacity:0;transform:translateY(24px);filter:blur(7px);transition:opacity 1.1s var(--ease),transform 1.2s var(--ease),filter 1.1s var(--ease)}
.rv.in{opacity:1;transform:none;filter:none}

.q{position:relative;margin:clamp(40px,9vh,72px) 0;padding:clamp(22px,4vw,34px) 6px;text-align:center;
  font-weight:500;font-size:clamp(22px,5.9vw,31px);line-height:1.75;color:#fff;
  text-shadow:0 0 22px rgba(255,120,200,.55),0 0 46px rgba(180,110,255,.35),0 2px 12px rgba(8,2,14,.7);opacity:1;transform:none;filter:none}
.q::before,.q::after{position:absolute;font-family:var(--fe);font-style:italic;font-size:74px;line-height:1;color:rgba(255,134,200,.45);text-shadow:0 0 20px rgba(255,120,200,.5);
  opacity:0;transition:opacity 1.6s ease .2s}
.q::before{content:'“';left:-2px;top:-6px}
.q::after{content:'”';right:-2px;bottom:-34px}
.q.in::before,.q.in::after{opacity:1}
.q .w{display:inline-block;white-space:pre;opacity:0;transform:translateY(12px);filter:blur(6px);
  transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease);transition-delay:calc(var(--i)*55ms)}
.q.in .w{opacity:1;transform:none;filter:none}
.q::before,.q::after{pointer-events:none}

.orn{display:flex;align-items:center;justify-content:center;gap:16px;margin:clamp(46px,10vh,84px) 0;color:var(--pink);font-size:14px}
.orn::before,.orn::after{content:'';height:1px;width:clamp(50px,16vw,96px);background:linear-gradient(90deg,rgba(255,150,210,0),rgba(255,150,210,.7))}
.orn::after{transform:scaleX(-1)}
.orn span{filter:drop-shadow(0 0 8px rgba(255,120,200,.9))}

/* finale */
#end{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16vh 24px 12vh}
.endglow{position:absolute;left:50%;top:44%;width:min(120vw,760px);height:min(120vw,760px);margin:calc(min(120vw,760px)/-2) 0 0 calc(min(120vw,760px)/-2);border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,110,190,.28),rgba(190,100,255,.12) 55%,rgba(0,0,0,0) 76%);opacity:0;transition:opacity 2.4s ease}
#end.in .endglow{opacity:1;animation:glowbeat 1.7s ease-in-out infinite}
@keyframes glowbeat{50%{transform:scale(1.1);opacity:.75}}
.heart{position:relative;width:clamp(96px,26vw,140px);height:auto;overflow:visible}
.heart path{fill:rgba(255,120,195,0);stroke:url(#hg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
  filter:drop-shadow(0 0 6px rgba(255,130,200,.9))}
#end.in .heart path{animation:draw 2.6s var(--ease) .2s forwards,fillin 1.6s ease 2.4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill:rgba(255,120,195,.32)}}
#end.in .heart{animation:beat 1.7s ease-in-out 3.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.1)}28%{transform:scale(1)}42%{transform:scale(1.06)}}
.closing{margin-top:34px;max-width:22em;font-weight:400;font-size:clamp(20px,5.2vw,27px);line-height:1.8;color:#fff;
  text-shadow:0 0 22px rgba(255,120,200,.55),0 2px 12px rgba(8,2,14,.7);white-space:pre-line}
.again{margin-top:44px;font-family:var(--f);font-size:16px;color:var(--pink-soft);padding:13px 30px;border:0;border-radius:999px;cursor:pointer;
  background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,205,235,.4);transition:transform .4s var(--spring)}
.again:active{transform:scale(.95)}
@media (hover:hover){.again:hover{transform:translateY(-2px)}}

@media (prefers-reduced-motion:reduce){
  .blob,.mote,.tw,.hint svg,#end.in .heart,#end.in .endglow{animation:none!important}
  .rv,.title .ch,.q .w{transition-duration:.01s!important;transition-delay:0s!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body class="locked">

<!-- 1 · the lock: no words, no pictures. Just the code. -->
<div id="lock">
  <div id="pins"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div id="steps"><b class="on"></b><b></b></div>
  <div id="lockmsg"></div>
  <input id="pin" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" maxlength="6"
         autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="code">
</div>
<div id="bloom"></div>

<!-- 2 · everything else is built after unlocking -->
<div id="app">
  <div id="sky">
    <canvas id="sky1"></canvas>
    <canvas id="sky2"></canvas>
    <div id="twk"></div>
    <div id="asets"></div>
    <div id="motes"></div>
  </div>
  <div id="bar"><i></i></div>
  <nav id="rail" aria-label="chapters"></nav>
  <button id="music" class="none" aria-label="เพลง">♪</button>
  <main id="doc"></main>
</div>
<audio id="bgm" loop preload="none"></audio>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   NOTHING SECRET LIVES IN THIS FILE.
   The messages are encrypted in messages.enc.js. The key is derived
   from BOTH codes together, so a wrong code (or a wrong pair) simply
   fails to decrypt. The codes themselves are not stored anywhere.
   ═══════════════════════════════════════════════════════════════ */
const MUSIC = 'Desktop-2025.mp3';     // optional: delete the file / clear this to have no music

const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const wait = ms => new Promise(r => setTimeout(r, ms));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

/* ───────── find + load the encrypted messages (next to this page, or one folder up) ───────── */
function loadSealed(){
  return new Promise(res => {
    if(window.SEALED) return res(true);
    const paths = ['messages.enc.js', '../messages.enc.js'];
    const next = i => {
      if(i >= paths.length) return res(false);
      const s = document.createElement('script');
      s.src = paths[i];
      s.onload = () => res(!!window.SEALED);
      s.onerror = () => { s.remove(); next(i + 1); };
      document.head.appendChild(s);
    };
    next(0);
  });
}
const sealedReady = loadSealed();

/* ───────── decrypt ───────── */
async function unseal(sealed, c1, c2){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(c1 + '␟' + c2), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64d(sealed.s), iterations:sealed.it, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64d(sealed.iv) }, key, b64d(sealed.ct));
  return new TextDecoder().decode(plain);
}

// Either code can be entered first: the key was made from the two codes in one fixed order, so try both orders.
async function unsealEither(sealed, a, b){
  try{ return await unseal(sealed, a, b); }catch(_){}
  return await unseal(sealed, b, a);
}

/* ───────── the lock ───────── */
const lock = $('#lock'), pin = $('#pin'), pins = [...document.querySelectorAll('#pins i')], steps = [...document.querySelectorAll('#steps b')];
let step = 0, first = '', busy = false;
const lockMsg = t => { const m = document.getElementById('lockmsg'); m.textContent = t; };
const paint = n => pins.forEach((p,i) => p.classList.toggle('on', i < n));
const focusPin = () => { try{ pin.focus({ preventScroll:true }); }catch(_){ pin.focus(); } };
lock.addEventListener('pointerdown', e => { e.preventDefault(); focusPin(); });
addEventListener('load', focusPin);
focusPin();

// Digits are read from the PHYSICAL key (Digit0-9 / Numpad0-9), so it works even when the keyboard is on the Thai layout
// (on Thai layout the number row types letters like จ or /, which used to be thrown away). Phones use the input event.
let buf = '';
const THAI = '๐๑๒๓๔๕๖๗๘๙';
function setBuf(v){ buf = v.slice(0, 6); pin.value = buf; changed(); }
pin.addEventListener('keydown', e => {
  if(busy){ e.preventDefault(); return; }
  const m = /^(?:Digit|Numpad)(\d)$/.exec(e.code);
  if(m && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); setBuf(buf + m[1]); return; }
  if(e.key === 'Backspace'){ e.preventDefault(); setBuf(buf.slice(0, -1)); }
});
pin.addEventListener('input', () => {
  if(busy) return;
  setBuf(pin.value.replace(/[๐-๙]/g, c => THAI.indexOf(c)).replace(/\D/g, ''));
});

async function changed(){
  paint(buf.length);
  if(busy || buf.length < 6) return;
  busy = true;
  if(step === 0){                                  // first code done → wait for the second
    first = buf; buf = ''; pin.value = '';
    await wait(220); paint(0);
    step = 1; steps[1].classList.add('on'); busy = false;
    return;
  }
  lock.classList.add('busy');
  const second = buf;
  let text = null;
  lockMsg('');
  try{
    if(!(window.crypto && crypto.subtle)){ lockMsg('ต้องเปิดผ่าน https หรือ localhost'); throw new Error('needs https'); }
    if(!await sealedReady){ lockMsg('ไม่พบไฟล์ messages.enc.js'); throw new Error('no messages file'); }
    text = await unsealEither(window.SEALED, first, second);
  }catch(err){
    text = null;
    if(!(crypto && crypto.subtle)) console.warn('This page must be opened over https (or localhost) for the code to work.');
  }
  first = ''; buf = ''; pin.value = '';
  lock.classList.remove('busy');
  if(text === null){                               // wrong: shake, start over. Never says which code was wrong.
    lock.classList.add('bad');
    await wait(600);
    lock.classList.remove('bad'); paint(0);
    step = 0; steps[1].classList.remove('on'); busy = false;
    return;
  }
  lock.classList.add('ok');
  await wait(650);
  unlock(text);
}

/* ───────── text → structure ─────────
   # title            #> subtitle          ## chapter heading
   blank line = new paragraph              > a highlighted line
   ---  = ornament                         @closing  final words            */
function parse(src){
  const doc = { title:'', sub:'', closing:'', chapters:[] };
  let cur = null, para = [], lastQuote = false, inClosing = false;
  const push = b => { if(!cur){ cur = { h:'', blocks:[] }; doc.chapters.push(cur); } cur.blocks.push(b); };
  const flush = () => { if(para.length){ push({ t:'p', lines:para }); para = []; } };
  for(const raw of src.replace(/\r/g,'').split('\n')){
    const l = raw.replace(/\s+$/,'');
    if(inClosing){ doc.closing += '\n' + l; continue; }        // everything after @closing belongs to the ending
    if(l.startsWith('#> ')){ doc.sub = l.slice(3).trim(); continue; }
    if(l.startsWith('## ')){ flush(); cur = { h:l.slice(3).trim(), blocks:[] }; doc.chapters.push(cur); lastQuote = false; continue; }
    if(l.startsWith('# ')){ doc.title = l.slice(2).trim(); continue; }
    if(l.startsWith('@closing')){ flush(); doc.closing = l.slice(8).trim(); inClosing = true; continue; }
    if(l.trim() === '---'){ flush(); push({ t:'hr' }); lastQuote = false; continue; }
    if(l.startsWith('> ')){
      flush();
      if(lastQuote) cur.blocks[cur.blocks.length-1].text += '\n' + l.slice(2).trim();
      else push({ t:'q', text:l.slice(2).trim() });
      lastQuote = true; continue;
    }
    lastQuote = false;
    if(!l.trim()){ flush(); continue; }
    para.push(l);
  }
  flush();
  doc.closing = doc.closing.trim();
  return doc;
}

/* ───────── build the page ───────── */
const seg = (s, g) => 'Segmenter' in Intl ? Array.from(new Intl.Segmenter('th', { granularity:g }).segment(s), x => x.segment)
                                           : (g === 'word' ? s.split(/(\s+)/) : Array.from(s));
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }

const PAL = [ [[255,105,190],[140,90,255]], [[120,95,255],[90,160,255]], [[255,150,125],[255,105,170]], [[232,92,222],[255,140,200]] ];
let chapEls = [], railBtns = [], asets = [];

function build(d){
  const doc = $('#doc'); doc.textContent = '';

  // aurora sets, one palette per chapter mood
  const box = $('#asets');
  PAL.forEach(([a,b]) => {
    const s = el('div', 'aset');
    [['b1',a,.2],['b2',b,.22]].forEach(([c,rgb,al]) => {
      const bl = el('div', 'blob ' + c);
      bl.style.background = `radial-gradient(closest-side,rgba(${rgb},${al}),rgba(${rgb},0) 70%)`;
      s.appendChild(bl);
    });
    box.appendChild(s); asets.push(s);
  });
  asets[0].classList.add('on');

  // hero
  const hero = el('header', 'hero');
  hero.appendChild(el('div', 'eyebrow', 'for you'));
  const h1 = el('h1', 'title');
  seg(d.title || '♡', 'grapheme').forEach((g,i) => { const s = el('span', 'ch', g); s.style.setProperty('--i', i); h1.appendChild(s); });
  hero.appendChild(h1);
  if(d.sub) hero.appendChild(el('p', 'sub', d.sub));
  const hint = el('div', 'hint');
  hint.innerHTML = '<span>เลื่อนลงเพื่ออ่าน</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  hero.appendChild(hint);
  doc.appendChild(hero);

  // chapters
  const wrap = el('div', 'col');
  d.chapters.forEach((c, ci) => {
    const sec = el('section', 'chap'); sec.dataset.i = ci; sec.dataset.pal = ci % PAL.length;
    if(c.h){
      const head = el('div', 'rv');
      head.appendChild(el('div', 'num', String(ci + 1).padStart(2, '0')));
      head.appendChild(el('h2', 'h', c.h));
      const rule = el('div', 'rule'); rule.appendChild(el('i')); rule.appendChild(el('span', '', '✦'));
      head.appendChild(rule);
      sec.appendChild(head);
    }
    c.blocks.forEach(b => {
      if(b.t === 'p'){
        const p = el('p', 't rv');
        b.lines.forEach((ln, i) => { if(i) p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(ln)); });
        sec.appendChild(p);
      }else if(b.t === 'q'){
        const q = el('blockquote', 'q');
        let n = 0;
        b.text.split('\n').forEach((ln, li) => {
          if(li) q.appendChild(document.createElement('br'));
          seg(ln, 'word').forEach(w => { const s = el('span', 'w', w); s.style.setProperty('--i', n++); q.appendChild(s); });
        });
        sec.appendChild(q);
      }else{
        const o = el('div', 'orn rv'); o.appendChild(el('span', '', '✦')); sec.appendChild(o);
      }
    });
    wrap.appendChild(sec);
  });
  doc.appendChild(wrap);

  // finale
  const end = el('section', 'end'); end.id = 'end';
  end.innerHTML = `<div class="endglow"></div>
    <svg class="heart" viewBox="0 0 100 92" aria-hidden="true"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#ff9fd2"/><stop offset="1" stop-color="#b98cff"/></linearGradient></defs>
    <path pathLength="1" d="M50 86 C14 58 2 40 2 26 C2 12 13 3 26 3 C36 3 45 9 50 18 C55 9 64 3 74 3 C87 3 98 12 98 26 C98 40 86 58 50 86 Z"/></svg>`;
  end.appendChild(el('p', 'closing rv', d.closing || '♡'));
  const again = el('button', 'again rv', 'อ่านอีกครั้ง ↑');
  again.addEventListener('click', () => scrollTo({ top:0, behavior:'smooth' }));
  end.appendChild(again);
  doc.appendChild(end);

  // side rail: one dot per chapter
  const rail = $('#rail'); rail.textContent = '';
  railBtns = [];
  d.chapters.forEach((c, ci) => {
    if(!c.h) return;
    const b = el('button'); b.dataset.h = c.h; b.setAttribute('aria-label', c.h);
    b.addEventListener('click', () => document.querySelector(`.chap[data-i="${ci}"]`).scrollIntoView({ behavior:'smooth', block:'start' }));
    rail.appendChild(b); railBtns.push([b, ci]);
  });
  chapEls = [...document.querySelectorAll('.chap')];
}

/* ───────── the sky (drawn once) ───────── */
function sprite(r,g,b){
  const s = 64, c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d'), gr = x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,`rgba(${r},${g},${b},1)`); gr.addColorStop(.22,`rgba(${r},${g},${b},.6)`); gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0,0,s,s); return c;
}
let SPR;
function renderSky(){
  SPR = SPR || { pink:sprite(255,125,200), mag:sprite(232,86,212), vio:sprite(150,105,255), white:sprite(255,240,248), gold:sprite(255,205,150), blue:sprite(120,170,255), rose:sprite(255,170,205) };
  const W = innerWidth, H = innerHeight + 320, d = Math.min(devicePixelRatio || 1, 1.5), M = Math.max(W, H);
  const c = $('#sky1'); c.width = W*d; c.height = H*d;
  const x = c.getContext('2d'); x.scale(d,d);
  x.globalCompositeOperation = 'lighter';
  for(let i=0;i<8;i++){ const s = M*rnd(.5,.95); x.globalAlpha = rnd(.04,.09); x.drawImage(pick([SPR.vio,SPR.mag,SPR.pink,SPR.vio,SPR.blue]), rnd(-.2,1)*W - s/2, rnd(-.1,1.1)*H - s/2, s, s); }
  const ang = rnd(-.6,-.3), bl = M*.9;
  for(let i=0;i<80;i++){                                    // faint milky band
    const t = rnd(-1,1), off = (Math.random()+Math.random()+Math.random()-1.5)*M*.09;
    const px = W/2 + Math.cos(ang)*t*bl - Math.sin(ang)*off, py = H/2 + Math.sin(ang)*t*bl + Math.cos(ang)*off, s = M*rnd(.05,.16);
    x.globalAlpha = rnd(.025,.05)*(1 - Math.abs(t)*.6);
    x.drawImage(pick([SPR.rose,SPR.vio,SPR.pink]), px-s/2, py-s/2, s, s);
  }
  x.globalCompositeOperation = 'source-over';
  const cols = ['#ffffff','#ffd9ef','#e6d2ff','#d4e2ff','#ffe9d0'];
  const n = Math.round(W*H/1300);
  for(let i=0;i<n;i++){ const a = Math.random(); x.globalAlpha = .12 + .6*a*a*a; x.fillStyle = pick(cols); const s = .5 + a*1.1; x.fillRect(Math.random()*W, Math.random()*H, s, s); }
  for(let i=0;i<10;i++){                                    // big stars with spikes
    const px = Math.random()*W, py = Math.random()*H, L = rnd(16,38);
    x.globalAlpha = rnd(.3,.65); x.drawImage(SPR.white, px-L/2, py-.7, L, 1.4); x.drawImage(SPR.white, px-.7, py-L/2, 1.4, L);
    x.globalAlpha = .9; x.drawImage(pick([SPR.white,SPR.rose]), px-6, py-6, 12, 12);
  }
  const c2 = $('#sky2'); c2.width = W*d; c2.height = H*d;
  const y = c2.getContext('2d'); y.scale(d,d);
  for(let i=0;i<Math.round(W*H/17000);i++){
    const s = rnd(5,13), px = Math.random()*W, py = Math.random()*H;
    y.globalAlpha = rnd(.35,.85); y.drawImage(pick([SPR.white,SPR.white,SPR.rose,SPR.vio,SPR.gold]), px-s/2, py-s/2, s, s);
  }
}
function buildAmbient(){
  const tw = $('#twk');
  for(let i=0;i<30;i++){
    const t = el('i', 'tw'); t.style.left = rnd(2,98) + '%'; t.style.top = rnd(2,98) + '%';
    t.style.setProperty('--d', rnd(2.4,6) + 's'); t.style.setProperty('--dl', rnd(0,5) + 's');
    const s = rnd(1.5,3.2); t.style.width = t.style.height = s + 'px'; tw.appendChild(t);
  }
  const box = $('#motes'), cols = ['rgba(255,240,248,1)','rgba(255,170,205,1)','rgba(255,125,200,1)','rgba(170,125,255,1)','rgba(255,205,150,1)'];
  const n = clamp(Math.round(innerWidth*innerHeight/24000), 14, 30);
  for(let i=0;i<n;i++){
    const m = el('i', 'mote'), z = rnd(.3,1);
    m.style.setProperty('--x', rnd(0,100) + '%'); m.style.setProperty('--s', (6 + z*16) + 'px'); m.style.setProperty('--c', pick(cols));
    m.style.setProperty('--o', (.16 + .3*z).toFixed(2)); m.style.setProperty('--dx', rnd(-90,90) + 'px');
    m.style.setProperty('--d', (rnd(26,60)/z*.6).toFixed(1) + 's'); m.style.setProperty('--dl', (-rnd(0,50)).toFixed(1) + 's');
    box.appendChild(m);
  }
}
function shootingStar(){
  if(!document.hidden){
    const s = el('div', 'shoot'), W = innerWidth, H = innerHeight;
    s.style.left = rnd(W*.4, W*1.02) + 'px'; s.style.top = rnd(-10, H*.4) + 'px';
    $('#sky').appendChild(s);
    const ang = rnd(148,168), dist = Math.max(W,H)*.55;
    s.animate([{ transform:`rotate(${ang}deg) translateX(0)`, opacity:0 }, { opacity:1, offset:.18 }, { transform:`rotate(${ang}deg) translateX(${dist}px)`, opacity:0 }],
      { duration:rnd(1100,1600), easing:'cubic-bezier(.35,0,.65,1)' }).onfinish = () => s.remove();
  }
  setTimeout(shootingStar, rnd(4500,10000));
}

/* ───────── scroll: progress, parallax, chapter mood, reveal ───────── */
let ticking = false, s1, s2, tw, bar;
function onScroll(){
  ticking = false;
  const max = Math.max(1, document.documentElement.scrollHeight - innerHeight), p = clamp(scrollY / max, 0, 1);
  bar.style.transform = `scaleX(${p.toFixed(4)})`;
  s1.style.translate = `0 ${(-p*90).toFixed(1)}px`;
  s2.style.translate = `0 ${(-p*190).toFixed(1)}px`;
  tw.style.translate = `0 ${(-p*140).toFixed(1)}px`;
}
function layoutRail(){
  const total = document.documentElement.scrollHeight - innerHeight;
  railBtns.forEach(([b, ci]) => {
    const sec = document.querySelector(`.chap[data-i="${ci}"]`);
    b.style.top = clamp((sec.offsetTop - innerHeight*.3) / Math.max(1, total), 0, 1) * 100 + '%';
  });
}
let current = -1;
function startObservers(){
  const rv = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); rv.unobserve(e.target); } }),
    { threshold:.12, rootMargin:'0px 0px -7% 0px' });
  document.querySelectorAll('.rv, .q, #end').forEach(n => rv.observe(n));
  const mood = new IntersectionObserver(es => es.forEach(e => {
    if(!e.isIntersecting) return;
    current = +e.target.dataset.i;
    asets.forEach((s,k) => s.classList.toggle('on', k === +e.target.dataset.pal));
    railBtns.forEach(([b, ci]) => b.classList.toggle('on', ci === current));
  }), { rootMargin:'-42% 0px -52% 0px' });
  chapEls.forEach(c => mood.observe(c));
  const top = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ current = -1; asets.forEach((s,k) => s.classList.toggle('on', k === 0)); railBtns.forEach(([b]) => b.classList.remove('on')); } }),
    { rootMargin:'-40% 0px -40% 0px' });
  top.observe($('.hero'));
}

/* ───────── unlock ───────── */
let musicOn = false;
function unlock(text){
  const d = parse(text);
  build(d);
  renderSky(); buildAmbient();
  s1 = $('#sky1'); s2 = $('#sky2'); tw = $('#twk'); bar = $('#bar i');
  $('#bloom').classList.add('go');
  document.body.classList.remove('locked'); document.documentElement.classList.remove('locked');
  document.body.classList.add('open');
  lock.classList.add('gone');
  scrollTo(0, 0);
  addEventListener('scroll', () => { if(!ticking){ ticking = true; requestAnimationFrame(onScroll); } }, { passive:true });
  addEventListener('resize', () => { clearTimeout(unlock.t); unlock.t = setTimeout(() => { renderSky(); layoutRail(); onScroll(); }, 200); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layoutRail(); onScroll(); });
  layoutRail(); onScroll();
  setTimeout(() => { $('.hero').classList.add('in'); startObservers(); setTimeout(shootingStar, 3500); }, 700);
  setTimeout(() => lock.remove(), 2200);
  setupMusic();
}
function setupMusic(){
  const btn = $('#music'), a = $('#bgm');
  if(!MUSIC) return;
  a.src = MUSIC; a.volume = .5;
  let triedUp = false;
  a.addEventListener('error', () => { if(!triedUp){ triedUp = true; a.src = '../' + MUSIC; } else btn.classList.add('none'); });
  btn.classList.remove('none');
  const start = () => a.play().then(() => { musicOn = true; btn.classList.remove('muted'); }).catch(() => btn.classList.add('muted'));
  start();
  btn.addEventListener('click', () => { if(musicOn){ a.pause(); musicOn = false; btn.classList.add('muted'); } else start(); });
}
